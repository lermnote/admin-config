name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.2'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm

      - name: Install Composer dependencies (production only)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify version consistency
        run: php tools/sync-version.php --check

      - name: Extract tag version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create distribution archive
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="admin-config/" HEAD \
            -x "tests/*" "docs/*" "tools/*" "examples/*" \
               ".github/*" "node_modules/*" "*.patch" \
               "package.json" "package-lock.json" "webpack.config.js" \
               "playwright.config.js" "phpunit*.xml.dist" \
               "phpcs.xml.dist" "phpstan.neon.dist" ".wp-env.json" \
               "CONTRIBUTING.md" "MAINTAINING.md" "SECURITY.md" \
               "CLAUDE.md" "AGENTS.md" \
            -o dist/admin-config-${{ steps.version.outputs.version }}.zip

          # Add built assets to the archive
          cd assets/build && zip -r ../../dist/admin-config-${{ steps.version.outputs.version }}.zip . -x ".*" && cd ../..

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract section for this version from CHANGELOG.md
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${VERSION}" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8bb048
        with:
          name: ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/admin-config-${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
